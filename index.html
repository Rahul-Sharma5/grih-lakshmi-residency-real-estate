
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grih & Lakshmi Residency | Our Legacy of Trust</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          animation: {
            'marquee': 'marquee 40s linear infinite',
            'water-drop': 'water-drop 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            'water-drop': {
              '0%': { transform: 'scale(0.8)', opacity: '0.8' },
              '100%': { transform: 'scale(1.8)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-font: 'Poppins';
      --base-font-size: 16px;
      --ticker-height: 44px;
    }
    html {
      font-size: var(--base-font-size);
      transition: font-size 0.2s ease;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0fdf4;
      color: #064e3b;
      overflow-x: hidden;
      width: 100%;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* Global Pitch Black Dark Mode */
    .dark body {
      background-color: #000000 !important;
      color: #ffffff !important;
    }
    .dark section {
      background-color: #000000 !important;
    }
    .dark .bg-white, 
    .dark .bg-emerald-50, 
    .dark .bg-emerald-50\/20, 
    .dark .bg-emerald-50\/30,
    .dark .bg-emerald-50\/40,
    .dark .bg-emerald-50\/50,
    .dark .bg-emerald-50\/80 {
      background-color: #000000 !important;
      color: #ffffff !important;
      border-color: #262626 !important;
    }
    
    .dark .text-emerald-950, 
    .dark .text-emerald-900,
    .dark .text-emerald-800,
    .dark .text-emerald-700,
    .dark h1, .dark h2, .dark h3, .dark h4, .dark h5 {
      color: #ffffff !important;
    }
    
    .dark .text-emerald-600 {
      color: #10b981 !important;
    }

    .dark .border-emerald-100,
    .dark .border-emerald-100\/50,
    .dark .border-slate-100 {
      border-color: #262626 !important;
    }

    .dark footer {
      background-color: #000000 !important;
      border-top: 1px solid #262626;
    }

    .dark nav {
      background-color: rgba(0, 0, 0, 0.8) !important;
      border-bottom: 1px solid #262626 !important;
    }

    .dark .green-gradient {
      background: linear-gradient(135deg, #065f46 0%, #000000 100%);
      border: 1px solid #059669;
    }

    h1, h2, h3, h4 {
      font-family: 'Poppins', sans-serif;
    }
    .green-gradient {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f0fdf4;
    }
    .dark ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #059669;
      border-radius: 4px;
    }
    
    .marquee-container {
      display: flex;
      width: fit-content;
      animation: marquee 35s linear infinite;
    }
    .marquee-container:hover {
      animation-play-state: paused;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>

}
</script>
